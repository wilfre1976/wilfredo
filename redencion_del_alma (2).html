<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1222">
<title>Redención del Alma</title>
<style>
:root{--bg:#0c1222;--gold:#e8c468;--gold2:#f5e0a8;--clay:#c98a54;--text:#f3ead7;--dim:#b8a88a;--ok:#5dba5d;--bad:#c44}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;touch-action:none;position:fixed;user-select:none}
#c{position:fixed;inset:0;z-index:1}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:20;pointer-events:none}
#hud-title{color:var(--gold2);font-size:15px;font-weight:700;text-shadow:0 2px 8px #000}
#hud-progress{background:rgba(0,0,0,.5);border:2px solid var(--gold);border-radius:20px;padding:6px 14px;color:var(--gold2);font-size:14px;font-weight:700}
#hud-bar{width:120px;height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:5px;overflow:hidden}
#hud-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--clay),var(--gold));transition:width .5s}
#hint{position:fixed;left:50%;bottom:125px;transform:translateX(-50%);background:var(--gold);color:#0c1222;font-size:15px;font-weight:700;padding:11px 20px;border-radius:24px;z-index:25;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#hint.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
#card{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(40px);width:min(480px,94vw);background:#f8f0dc;border:4px solid var(--gold);border-radius:18px;padding:18px 16px 14px;z-index:30;opacity:0;pointer-events:none;transition:.35s;box-shadow:0 14px 40px rgba(0,0,0,.55)}
#card.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#card-emoji{font-size:32px;text-align:center;margin-bottom:4px}
#card-who{font-size:12px;font-weight:800;color:#a67c00;text-transform:uppercase;text-align:center;margin-bottom:6px;letter-spacing:.04em}
#card-txt{font-size:16px;line-height:1.45;color:#2a2215;text-align:center;margin-bottom:14px}
#card-btn{width:100%;background:var(--gold);color:#0c1222;border:none;border-radius:14px;padding:13px;font-size:16px;font-weight:800;cursor:pointer}
#card-btn:active{transform:scale(.97)}
#chal{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(40px);width:min(480px,94vw);background:#f8f0dc;border:4px solid var(--ok);border-radius:18px;padding:16px;z-index:30;opacity:0;pointer-events:none;transition:.35s;box-shadow:0 14px 40px rgba(0,0,0,.55)}
#chal.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#chal-q{font-size:16px;font-weight:800;color:#1a2744;text-align:center;margin-bottom:12px;line-height:1.4}
.opt{display:block;width:100%;background:#fff;border:3px solid #ddd0b0;border-radius:14px;padding:12px 14px;margin-bottom:9px;font-size:15px;font-weight:700;color:#2a2215;text-align:left;cursor:pointer}
.opt:active{background:#f0e6c8}.opt.ok{background:#c8f0c8;border-color:var(--ok)}.opt.bad{background:#ffd0d0;border-color:var(--bad);opacity:.75}
#chal-fb{text-align:center;font-size:15px;font-weight:800;margin-top:6px;min-height:22px}
#ov{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 40%,#1e2a48,#080e1a);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity .7s}
#ov.hid{opacity:0;pointer-events:none}
#ov h1{font-size:clamp(26px,6.5vw,42px);color:var(--gold2);margin:10px 0 12px;text-shadow:0 0 24px rgba(232,196,104,.3)}
#ov p{font-size:15px;color:var(--dim);line-height:1.55;max-width:340px;margin:0 auto 22px}
.bbtn{background:var(--gold);color:#0c1222;border:none;border-radius:16px;padding:15px 34px;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.bbtn:active{transform:scale(.96)}
#joy{position:fixed;left:0;bottom:0;width:48%;height:40%;z-index:15;display:none}
#jbase{position:absolute;left:18px;bottom:20px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.1);border:3px solid rgba(232,196,104,.4)}
#jknob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(232,196,104,.5);transition:transform .04s linear}
#tbtn{position:fixed;right:16px;bottom:90px;width:72px;height:72px;border-radius:50%;background:var(--gold);color:#0c1222;border:4px solid #f8f0dc;font-size:13px;font-weight:800;display:none;align-items:center;justify-content:center;text-align:center;z-index:16;box-shadow:0 6px 20px rgba(0,0,0,.45);line-height:1.2}
#tbtn:active{transform:scale(.92)}#tbtn.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.45),0 0 0 0 rgba(232,196,104,.55)}50%{box-shadow:0 6px 20px rgba(0,0,0,.45),0 0 0 14px rgba(232,196,104,0)}}
#sbtn{position:fixed;top:max(10px,env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(232,196,104,.45);color:var(--gold2);font-size:17px;z-index:25;display:flex;align-items:center;justify-content:center;cursor:pointer}
#seals{position:fixed;left:10px;bottom:12px;display:flex;gap:6px;z-index:20;pointer-events:none}
.seal{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(232,196,104,.3);display:flex;align-items:center;justify-content:center;font-size:13px;transition:.4s}
.seal.on{background:var(--gold);border-color:#fff;box-shadow:0 0 10px var(--gold);transform:scale(1.12)}
/* Battle / cinematic overlay */
#cine{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
#cine.show{display:flex}
#cine-box{background:#f8f0dc;border:4px solid var(--gold);border-radius:18px;padding:22px 18px;max-width:420px;width:94vw;box-shadow:0 16px 50px rgba(0,0,0,.6)}
#cine-emoji{font-size:42px;margin-bottom:8px}
#cine-title{font-size:18px;font-weight:800;color:#1a2744;margin-bottom:10px}
#cine-txt{font-size:15px;line-height:1.5;color:#2a2215;margin-bottom:16px}
#cine-btn{width:100%;background:var(--gold);color:#0c1222;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
@media(hover:none){#joy{display:block}#tbtn{display:flex}}
@media(max-width:500px){#card,#chal,#cine-box{bottom:14px;padding:14px}#hint{bottom:110px;font-size:14px}}
</style>
</head>
<body>
<div id="c"></div>
<div id="hud">
  <div><div id="hud-title">Redención del Alma</div><div id="hud-bar"><div id="hud-fill"></div></div></div>
  <div id="hud-progress">Sellos: <span id="sn">0</span>/8</div>
</div>
<button id="sbtn">🔊</button>
<div id="hint">Camina hacia la luz dorada</div>
<div id="card"><div id="card-emoji">📖</div><div id="card-who">Narrador</div><div id="card-txt"></div><button id="card-btn">Continuar</button></div>
<div id="chal"><div id="chal-q"></div><div id="opts"></div><div id="chal-fb"></div></div>
<button id="tbtn">HABLAR</button>
<div id="seals">
  <div class="seal" id="s0">1</div><div class="seal" id="s1">2</div><div class="seal" id="s2">3</div><div class="seal" id="s3">4</div>
  <div class="seal" id="s4">5</div><div class="seal" id="s5">6</div><div class="seal" id="s6">7</div><div class="seal" id="s7">8</div>
</div>
<div id="cine">
  <div id="cine-box">
    <div id="cine-emoji">⚔️</div>
    <div id="cine-title"></div>
    <div id="cine-txt"></div>
    <button id="cine-btn">Continuar</button>
  </div>
</div>
<div id="ov">
  <div>
    <div style="font-size:48px;margin-bottom:8px">✝️</div>
    <h1>Redención del Alma</h1>
    <p>El proceso de redención es una guerra. Con la ayuda del Ángel vencerás al diablo, a la muerte y al mundo. Al final, tu alma será entregada a Dios y a la reunión de todos Sus ángeles.</p>
    <button class="bbtn" id="go">Comenzar el camino</button>
  </div>
</div>
<div id="joy"><div id="jbase"><div id="jknob"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

// ========== STATE ==========
const S = {BOOT:0, MENU:1, PLAY:2, DIALOG:3, CHAL:4, CINE:5, GUIDE:6, END:7};
let state = S.BOOT;
let seals = 0, current = null, lineIdx = 0, heading = Math.PI;
let started = false, guiding = false, guideT = 0;
let serpentBlocked = false, battleDone = false;

// ========== STAGES ==========
const STAGES = [
  {title:"Adán y Eva",emoji:"🌳",color:0x6fbf73,model:"person",
   lines:[{who:"Narrador",txt:"Dios creó al ser humano. El alma vivía en comunión perfecta con Él."},{who:"Narrador",txt:"Pero el pecado entró. El alma quedó herida y separada de su Creador."}],
   q:"¿Qué le pasó al alma con el pecado?",opts:["Quedó separada de Dios","Se hizo más fuerte","No pasó nada"],ok:0,
   good:"Correcto. El alma necesita redención.",bad:"El pecado separó el alma de Dios."},
  {title:"La Serpiente",emoji:"🐍",color:0xc44,model:"serpent",
   lines:[{who:"La Serpiente",txt:"Yo soy el diablo. Obstaculizo al creyente. Esta es una guerra por el alma."},{who:"Narrador",txt:"El diablo bloquea el camino. Sin ayuda no se puede ganar esta guerra."}],
   q:"¿Qué representa la serpiente en esta guerra?",opts:["Al diablo, enemigo del alma","A un animal cualquiera","A un amigo"],ok:0,
   good:"Correcto. La guerra es contra el diablo.",bad:"La serpiente representa al diablo."},
  {title:"La Promesa",emoji:"⭐",color:0x4a9eff,model:"person",
   lines:[{who:"El Ángel",txt:"Dios prometió un Redentor. En esta guerra no estás solo: yo peleo contigo contra el diablo, el mundo y la muerte."},{who:"Narrador",txt:"Con el Ángel, el creyente avanza. Cada paso es parte de ganar la guerra."}],
   q:"¿Quién ayuda al creyente en esta guerra?",opts:["El Ángel, enviado de Dios","Nadie","La serpiente"],ok:0,
   good:"Exacto. El Ángel pelea junto al creyente.",bad:"El Ángel es quien ayuda en la guerra."},
  {title:"El Cordero",emoji:"🐑",color:0xe8c468,model:"person",
   lines:[{who:"El Ángel",txt:"La sangre del Cordero vence al pecado y al diablo. Sigue conmigo: vamos ganando la guerra paso a paso."},{who:"Narrador",txt:"La sangre es arma de victoria. El Ángel no suelta la mano del creyente."}],
   q:"¿Qué vence la sangre del Cordero?",opts:["Al pecado y al diablo","Solo al cansancio","Nada"],ok:0,
   good:"Correcto. La sangre es victoria en la guerra.",bad:"La sangre vence al pecado y al diablo."},
  {title:"El Ángel Redentor",emoji:"👼",color:0xce93d8,model:"angel",
   lines:[{who:"El Ángel",txt:"Yo peleo por ti en toda esta guerra: contra el diablo, el mundo, el pecado y la muerte. No te dejo hasta entregar tu alma a Dios."},{who:"Narrador",txt:"El Ángel acompaña toda la secuencia. La redención es ganar la guerra completa."}],
   q:"¿Hasta cuándo pelea el Ángel por el creyente?",opts:["Hasta entregar el alma a Dios","Solo un momento","Hasta la mitad del camino"],ok:0,
   good:"¡Sí! Hasta que el alma sea entregada a Dios.",bad:"El Ángel pelea hasta el final."},
  {title:"El Nacimiento",emoji:"👶",color:0xffe08a,model:"person",
   lines:[{who:"El Ángel",txt:"Nació el Redentor. Él entró a la guerra por nosotros. Yo te traigo para que veas al que vence al mundo."},{who:"Narrador",txt:"Jesús es el campeón de esta guerra. El Ángel guía al creyente en cada etapa."}],
   q:"¿Quién entró a la guerra para redimirnos?",opts:["Jesús, el Redentor","Un rey humano","Nadie"],ok:0,
   good:"Exacto. Jesús es quien gana la guerra.",bad:"Jesús es el Redentor que pelea por nosotros."},
  {title:"La Cruz",emoji:"✝️",color:0xe0e0e0,model:"person",
   lines:[{who:"El Ángel",txt:"En la cruz se derrota al pecado, al diablo y a la muerte. «Consumado es.» Aquí se gana la guerra."},{who:"Narrador",txt:"El Ángel sostiene al creyente ante la cruz. Este es el golpe decisivo de la redención."}],
   q:"¿Qué se derrota en la cruz?",opts:["Al pecado, al diablo y a la muerte","Solo al cansancio","Nada importante"],ok:0,
   good:"Amén. En la cruz se gana la guerra.",bad:"En la cruz se derrota al pecado, diablo y muerte."},
  {title:"La Resurrección",emoji:"🌅",color:0xfff59d,model:"jesus",
   lines:[{who:"El Ángel",txt:"¡Resucitó! Se venció al diablo, al mundo, al pecado y a la muerte. Ahora entrego tu alma a Dios y a todos Sus ángeles."},{who:"Narrador",txt:"La guerra está ganada. El Ángel entrega el alma redimida a Dios y a la reunión de todos Sus ángeles."}],
   q:"¿A quién es entregada el alma al final?",opts:["A Dios y a la reunión de todos Sus ángeles","A la serpiente","A nadie"],ok:0,
   good:"¡Victoria! El alma es entregada a Dios y a todos Sus ángeles.",bad:"El alma es entregada a Dios y Sus ángeles."}
];

// ========== AUDIO ==========
let actx=null,master=null,musicG=null,sfxG=null,soundOn=true;
function initAudio(){if(actx)return;try{actx=new(window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.5;master.connect(actx.destination);musicG=actx.createGain();musicG.gain.value=0;musicG.connect(master);sfxG=actx.createGain();sfxG.gain.value=.75;sfxG.connect(master);startMusic()}catch(e){}}
function startMusic(){if(!actx)return;const ch=[[261.63,329.63,392],[196,246.94,293.66],[220,261.63,329.63],[174.61,220,261.63]];let ci=0;const pads=[];for(let i=0;i<3;i++){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=ch[0][i];g.gain.value=.035;o.connect(g);g.connect(musicG);o.start();pads.push({o,g})}musicG.gain.linearRampToValueAtTime(.65,actx.currentTime+2);setInterval(()=>{if(!soundOn||!actx)return;ci=(ci+1)%ch.length;pads.forEach((p,i)=>p.o.frequency.linearRampToValueAtTime(ch[ci][i],actx.currentTime+1.1))},2600);const mel=[392,440,523,587,523,440,392,349];let mi=0;setInterval(()=>{if(!soundOn||!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=mel[mi++%mel.length];g.gain.setValueAtTime(0,actx.currentTime);g.gain.linearRampToValueAtTime(.06,actx.currentTime+.07);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+1);o.connect(g);g.connect(musicG);o.start();o.stop(actx.currentTime+1.1)},1500)}
function tone(f,d,v=.12){if(!actx||!soundOn)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,actx.currentTime);g.gain.linearRampToValueAtTime(v,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(sfxG);o.start();o.stop(actx.currentTime+d+.05)}
function sfxChime(){tone(523,.22,.1);setTimeout(()=>tone(659,.28,.09),70);setTimeout(()=>tone(784,.35,.07),140)}
function sfxOk(){tone(523,.15,.12);setTimeout(()=>tone(659,.18,.1),80);setTimeout(()=>tone(784,.22,.09),160);setTimeout(()=>tone(1047,.35,.07),250)}
function sfxBad(){tone(200,.18,.1);setTimeout(()=>tone(160,.25,.08),90)}
function sfxStep(){if(!actx||!soundOn)return;const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=65+Math.random()*30;g.gain.setValueAtTime(.04,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.07);o.connect(g);g.connect(sfxG);o.start();o.stop(actx.currentTime+.09)}
function sfxBattle(){tone(150,.3,.15);setTimeout(()=>tone(180,.25,.12),100);setTimeout(()=>tone(220,.4,.1),200);setTimeout(()=>tone(523,.3,.08),400)}
document.getElementById('sbtn').onclick=()=>{if(!actx)initAudio();soundOn=!soundOn;document.getElementById('sbtn').textContent=soundOn?'🔊':'🔇';if(master)master.gain.value=soundOn?.5:0;if(soundOn&&actx.state==='suspended')actx.resume()};

// ========== THREE.JS ==========
const wrap=document.getElementById('c');
const ren=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});
ren.setPixelRatio(Math.min(devicePixelRatio,1.6));ren.setSize(innerWidth,innerHeight);wrap.appendChild(ren.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0c1222);scene.fog=new THREE.FogExp2(0x0c1222,.021);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,220);
window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
scene.add(new THREE.HemisphereLight(0x8a9cc8,0x1a2438,.9));
const sun=new THREE.DirectionalLight(0xfff5e0,.55);sun.position.set(-14,32,10);scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(130,290),new THREE.MeshLambertMaterial({color:0x152218}));
ground.rotation.x=-Math.PI/2;ground.position.z=-85;scene.add(ground);
const pMat=new THREE.MeshLambertMaterial({color:0xb06a32}),pMat2=new THREE.MeshLambertMaterial({color:0x965828});
for(let z=12;z>-230;z-=2.7){const b=new THREE.Mesh(new THREE.BoxGeometry(5.6,.13,2.6),(Math.floor(z)%2===0)?pMat:pMat2);b.position.set(Math.sin(-z*.027)*3.1,.07,z);scene.add(b)}
const gMat=new THREE.MeshLambertMaterial({color:0x2a4a2a});
for(let i=0;i<70;i++){const g=new THREE.Mesh(new THREE.ConeGeometry(.11,.48,5),gMat);const z=6-Math.random()*220;const side=Math.random()>.5?1:-1;g.position.set(Math.sin(-z*.027)*3.1+side*(3.4+Math.random()*2),.24,z);scene.add(g)}

function makePerson(col,halo=false){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.ConeGeometry(.55,1.4,10),new THREE.MeshLambertMaterial({color:col}));body.position.y=1.12;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,11,11),new THREE.MeshLambertMaterial({color:0xf0c8a0}));head.position.y=2;g.add(head);const em=new THREE.MeshLambertMaterial({color:0x222});const e1=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),em);e1.position.set(-.09,2.05,.24);const e2=e1.clone();e2.position.x=.09;g.add(e1,e2);if(halo){const h=new THREE.Mesh(new THREE.TorusGeometry(.34,.04,8,18),new THREE.MeshBasicMaterial({color:0xffe08a}));h.position.y=2.45;h.rotation.x=Math.PI/2;g.add(h)}return g}

function makeSerpent(){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.27,2.7,8),new THREE.MeshLambertMaterial({color:0x4a3020}));trunk.position.y=1.35;g.add(trunk);
  const leaves=new THREE.Mesh(new THREE.SphereGeometry(1.2,12,12),new THREE.MeshLambertMaterial({color:0x1a4a1a}));leaves.position.y=3;g.add(leaves);
  const sm=new THREE.MeshLambertMaterial({color:0x2d9a2d,emissive:0x0a3a0a});
  for(let i=0;i<6;i++){const c=new THREE.Mesh(new THREE.TorusGeometry(.3+i*.05,.1,8,16),sm);c.position.set(.04,.5+i*.35,.06);c.rotation.x=Math.PI/2;c.rotation.z=i*.5;g.add(c)}
  const hd=new THREE.Mesh(new THREE.SphereGeometry(.17,10,10),sm);hd.position.set(.42,2.5,.22);g.add(hd);
  const sn=new THREE.Mesh(new THREE.ConeGeometry(.09,.25,8),sm);sn.position.set(.55,2.5,.35);sn.rotation.x=Math.PI/2;g.add(sn);
  const em=new THREE.MeshBasicMaterial({color:0xff1111});
  const el=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),em);el.position.set(.5,2.6,.36);const er=el.clone();er.position.x=.36;g.add(el,er);
  const tg=new THREE.Mesh(new THREE.BoxGeometry(.025,.025,.18),new THREE.MeshBasicMaterial({color:0xff2222}));tg.position.set(.6,2.45,.48);g.add(tg);
  return g;
}

function makeAngel(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.ConeGeometry(.62,1.55,12),new THREE.MeshLambertMaterial({color:0xfffaf0}));body.position.y=1.22;g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.3,12,12),new THREE.MeshLambertMaterial({color:0xf5d0a9}));head.position.y=2.15;g.add(head);
  const em=new THREE.MeshLambertMaterial({color:0x333});
  const e1=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),em);e1.position.set(-.1,2.2,.26);const e2=e1.clone();e2.position.x=.1;g.add(e1,e2);

function dist(a,b){const dx=a.x-b.x,dz=a.z-b.z;return Math.sqrt(dx*dx+dz*dz)}

function tryTalk(){
  if(state!==S.PLAY) return;
  const near=stages.find(s=>!s.done&&dist(player.position,s.grp.position)<4.0);
  if(!near) return;

  // Special: if serpent and battle not done yet → trigger battle sequence first
  if(near === stages[1] && !battleDone){
    startBattleSequence();
    return;
  }

  current=near; lineIdx=0; state=S.DIALOG;
  showLine();
  document.getElementById('hint').classList.remove('show');
  document.getElementById('tbtn').classList.remove('pulse');
  sfxChime();
}

// ========== MAIN LOOP ==========
const clock=new THREE.Clock(); let stepT=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;

  // Movimiento interactivo de todos los personajes
  stages.forEach((s,i)=>{
    const nearPlayer = dist(player.position, s.grp.position) < 5.5;
    // Flotación base
    s.person.position.y = Math.sin(t*1.7+i)*.05 + (nearPlayer && !s.done ? 0.08 : 0);
    // Rotación hacia el jugador cuando se acerca
    if(nearPlayer && !s.done && s.data.model !== 'serpent'){
      const dx = player.position.x - s.grp.position.x;
      const dz = player.position.z - s.grp.position.z;
      const targetRot = Math.atan2(dx, dz);
      s.person.rotation.y += (targetRot - s.person.rotation.y) * 0.04;
    } else if(s.data.model !== 'serpent'){
      s.person.rotation.y = Math.sin(t*0.6+i)*0.15;
    }
    // Anillo late más fuerte cerca
    s.ring.material.opacity = s.done ? .15 : (nearPlayer ? .55+Math.sin(t*4)*.2 : .38+Math.sin(t*2.5)*.15);
    // Escala sutil al acercarse
    const targetScale = (nearPlayer && !s.done) ? 1.08 : 1.0;
    s.person.scale.x += (targetScale - s.person.scale.x) * 0.06;
    s.person.scale.y = s.person.scale.x;
    s.person.scale.z = s.person.scale.x;
  });

  // Ángel de batalla / compañero — movimiento vivo
  if(battleAngel.visible){
    battleAngel.position.y = Math.sin(t*2.4)*.12;
    battleAngel.rotation.y = Math.sin(t*1.1)*.22;
    battleAngel.scale.y = 1 + Math.sin(t*3)*.04;
  }

  // Millares de ángeles junto a la cruz — flotación suave
  for(let i = 0; i < hostAngels.length; i++){
    const a = hostAngels[i];
    const ud = a.userData;
    a.position.y = ud.baseY + Math.sin(t * ud.speed + ud.phase) * 0.15;
    a.rotation.y += 0.003;
  }

  // Serpiente: movimiento amenazante e interactivo
  if(serpentShake > 0){
    serpentShake -= dt;
    const serp = stages[1].person;
    serp.position.x = Math.sin(t*28) * 0.18 * serpentShake;
    serp.rotation.z = Math.sin(t*22) * 0.15 * serpentShake;
    serp.rotation.y = Math.sin(t*18) * 0.2 * serpentShake;
  } else if(stages[1] && !battleDone){
    const serp = stages[1].person;
    const distSerp = dist(player.position, stages[1].grp.position);
    // Más agresiva cuando el jugador se acerca
    const aggro = distSerp < 6 ? 1.6 : 1;
    serp.position.x = Math.sin(t*1.8*aggro) * 0.14 * aggro;
    serp.rotation.y = Math.sin(t*1.4*aggro) * 0.25 * aggro;
    serp.position.y = Math.sin(t*2.2)*.06;
    if(distSerp < 4.5){
      // Se lanza un poco hacia el jugador
      serp.position.z = Math.sin(t*3) * 0.15;
    }
  }

  // GUIDE STATE: Ángel lleva de la mano un tramo y luego acompaña TODA la secuencia
  if(state===S.GUIDE){
    guideT += dt;
    const targetZ = stages[2].z + 3; // avanza un poco y luego deja control al jugador
    if(player.position.z > targetZ){
      player.position.z -= 5.0 * dt;
      battleAngel.position.x = player.position.x + 1.15;
      battleAngel.position.z = player.position.z - 0.3;
      battleAngel.position.y = Math.sin(t*2)*.08;
      battleAngel.visible = true;
      heading = Math.PI;
      player.rotation.y = heading;
    } else {
      guiding = false;
      state = S.PLAY;
      angelCompanion = true; // acompaña TODA la secuencia restante
      document.getElementById('hint').textContent = 'El Ángel te acompaña por toda la secuencia de redención';
      document.getElementById('hint').classList.add('show');
    }
  }

  // Ángel compañero: permanece a tu lado en TODA la secuencia hasta el final
  if(angelCompanion && battleDone && (state===S.PLAY || state===S.DIALOG || state===S.CHAL)){
    battleAngel.visible = true;
    battleAngel.position.x += (player.position.x + 1.2 - battleAngel.position.x) * 0.08;
    battleAngel.position.z += (player.position.z - 0.4 - battleAngel.position.z) * 0.08;
    battleAngel.position.y = Math.sin(t*2)*.08;
  }

  if(state===S.PLAY){
    let turn=0,fwd=0;
    if(keys['a']||keys['arrowleft']) turn=1;
    if(keys['d']||keys['arrowright']) turn=-1;
    if(keys['w']||keys['arrowup']) fwd=1;
    if(keys['s']||keys['arrowdown']) fwd=-.5;
    if(joy.on){turn=-joy.x;fwd=joy.y}

    // If serpent not yet defeated, block going past it
    if(!battleDone && player.position.z < stages[1].z + 2.5){
      player.position.z = stages[1].z + 2.5;
      if(fwd>0){
        document.getElementById('hint').textContent = '¡La serpiente bloquea el camino! Acércate y toca HABLAR';
        document.getElementById('hint').classList.add('show');
      }
    }

    heading+=turn*2.7*dt;
    const sp=6.6*dt*fwd;
    player.position.x+=Math.sin(heading)*-sp;
    player.position.z+=Math.cos(heading)*-sp;
    player.rotation.y=heading;

    if(Math.abs(fwd)>.15){stepT-=dt;if(stepT<=0){sfxStep();stepT=.34}}

    const cx=Math.sin(-player.position.z*.027)*3.1;
    player.position.x=Math.max(cx-4,Math.min(cx+4,player.position.x));

    const near=stages.find(s=>!s.done&&dist(player.position,s.grp.position)<4.0);
    const hint=document.getElementById('hint'), tbtn=document.getElementById('tbtn');
    if(near){
      if(near===stages[1] && !battleDone) hint.textContent='¡La serpiente bloquea! Toca HABLAR';
      else hint.textContent='¡Toca HABLAR!';
      hint.classList.add('show'); tbtn.classList.add('pulse');
    } else if(seals<8){
      hint.textContent='Camina hacia la luz dorada';
      hint.classList.add('show'); tbtn.classList.remove('pulse');
    } else {
      hint.classList.remove('show'); tbtn.classList.remove('pulse');
    }
    if((keys['e']||keys[' '])&&near) tryTalk();
  }

  // Camera
  if(started){
    const d=7.6;
    cam.position.x+=(player.position.x+Math.sin(heading)*d-cam.position.x)*.09;
    cam.position.z+=(player.position.z+Math.cos(heading)*d-cam.position.z)*.09;
    cam.position.y=3.4;
    cam.lookAt(player.position.x,1.45,player.position.z);
  } else {
    cam.position.set(Math.sin(t*.12)*6.5,4,10.5);
    cam.lookAt(0,1.2,-5);
  }
  ren.render(scene,cam);
}
loop();
